services:
  postgres:
    image: postgres:17
    container_name: the-grill-debrecen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thegrill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thegrill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: